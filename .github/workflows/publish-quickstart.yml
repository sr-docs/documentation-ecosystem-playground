name: Documentation Ecosystem - Publish Quick Start

on:
  workflow_dispatch:
    inputs:
      draftContent:
        required: true
        type: string
      reviewStatus:
        required: true
        type: string
      runLinkCheck:
        required: true
        type: boolean
        default: false
      runHeadingCheck:
        required: true
        type: boolean
        default: false
      runCodeBlockCheck:
        required: true
        type: boolean
        default: false
      runConsistencyCheck:
        required: true
        type: boolean
        default: false
      runAccuracyCheck:
        required: true
        type: boolean
        default: false
      runValeCheck:
        required: true
        type: boolean
        default: false
      requestId:
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Write draft to file
        env:
          DRAFT_CONTENT: ${{ github.event.inputs.draftContent }}
        run: |
          echo "DRAFT_PATH=quick-start-guide.md" >> "$GITHUB_ENV"
          printf '%s' "$DRAFT_CONTENT" > quick-start-guide.md

      - name: Add watermark if not reviewed
        if: ${{ github.event.inputs.reviewStatus == 'not-reviewed' || github.event.inputs.reviewStatus == 'unknown' }}
        run: |
          {
            echo "> **NOT REVIEWED.** This draft was published without going through REVIEW."
            echo ""
            cat quick-start-guide.md
          } > quick-start-guide.tmp.md
          mv quick-start-guide.tmp.md quick-start-guide.md

      - name: Add watermark if changes were requested
        if: ${{ github.event.inputs.reviewStatus == 'changes-requested' }}
        run: |
          {
            echo "> **CHANGES REQUESTED.** A reviewer asked for changes, but this draft was published as-is."
            echo ""
            cat quick-start-guide.md
          } > quick-start-guide.tmp.md
          mv quick-start-guide.tmp.md quick-start-guide.md

      - name: Start results file
        run: |
          echo "# Publish check results" > results.md
          echo "" >> results.md
          echo "Request ID: ${{ github.event.inputs.requestId }}" >> results.md
          echo "Review status at publish time: ${{ github.event.inputs.reviewStatus }}" >> results.md
          echo "" >> results.md

      - name: Run documentation checks
        uses: ./.github/actions/run-doc-checks
        with:
          draft-path: ${{ env.DRAFT_PATH }}
          run-link-check: ${{ github.event.inputs.runLinkCheck }}
          run-heading-check: ${{ github.event.inputs.runHeadingCheck }}
          run-code-block-check: ${{ github.event.inputs.runCodeBlockCheck }}
          run-consistency-check: ${{ github.event.inputs.runConsistencyCheck }}
          run-accuracy-check: ${{ github.event.inputs.runAccuracyCheck }}
          run-vale-check: ${{ github.event.inputs.runValeCheck }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quick-start-${{ github.event.inputs.requestId }}
          path: |
            quick-start-guide.md
            results.md
          retention-days: 1

      - name: Commit results for inline display
        env:
          GH_TOKEN: ${{ secrets.WRITE_PAT }}
        run: |
          BRANCH="publish-results"
          REQUEST_ID="${{ github.event.inputs.requestId }}"

          git fetch origin
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -B "$BRANCH"
          fi

          mkdir -p "publish-results/$REQUEST_ID"
          cp quick-start-guide.md "publish-results/$REQUEST_ID/quick-start-guide.md"
          cp results.md "publish-results/$REQUEST_ID/results.md"

          if [ -z "$GH_TOKEN" ]; then
            echo "WRITE_PAT is not set; cannot push publish results." >&2
            exit 1
          fi

          git config user.name "Documentation Ecosystem Playground"
          git config user.email "actions@github.com"
          git add "publish-results/$REQUEST_ID"
          git commit -m "Publish results for $REQUEST_ID"
          git config --local --unset-all http.https://github.com/.extraheader || true
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH"
